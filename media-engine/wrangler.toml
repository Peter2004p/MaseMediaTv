name = "masenet-media-engine"
main = "src/index.ts"
compatibility_date = "2026-11-14"
workers_dev = true

[[containers]]
class_name = "MediaEngineContainer"
scheduling_policy = "durable_object"

[containers.images.base]
dockerfile = "./Dockerfile"

[[durable_objects.bindings]]
name = "MEDIA_ENGINE"
class_name = "MediaEngineContainer"

[exports.MediaEngineContainer]
type = "durable-object"
storage = "sqlite"

[observability]
enabled = true
