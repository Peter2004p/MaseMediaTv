<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MaseNet · Telegram diagnostics</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#090b10;color:#f4f6fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}
main{width:min(100%,520px);border:1px solid #282d38;border-radius:24px;padding:24px;background:#11151d}
h1{font-size:22px;margin:0 0 8px}p{color:#aab2c1;line-height:1.5;font-size:14px}
label{display:block;font-size:13px;margin:20px 0 8px;color:#cbd2df}
input{width:100%;padding:15px;border:1px solid #394150;border-radius:13px;background:#090d14;color:#fff;font-size:16px}
button{margin-top:14px;width:100%;padding:15px;border:0;border-radius:13px;background:#e8edf8;color:#111827;font-weight:700;font-size:15px}
button:disabled{opacity:.55}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080b11;border:1px solid #29313e;border-radius:14px;padding:15px;font-size:12px;line-height:1.55;margin-top:18px;display:none}
.small{font-size:12px;color:#8791a3}
</style>
</head>
<body>
<main>
<h1>MaseNet Telegram diagnostics</h1>
<p>Run a read-only check of the scheduled promotion system. The diagnostic does not send messages, polls, or social posts.</p>
<form id="check">
<label for="secret">Pages secret: TELEGRAM_PROMO_CRON_SECRET</label>
<input id="secret" type="password" autocomplete="off" required placeholder="Paste the existing secret value">
<button id="run" type="submit">Run safe diagnostic</button>
</form>
<button id="test" type="button" disabled>Send one admin-only Telegram test</button>
<pre id="result" aria-live="polite"></pre>
<p class="small">The secret is sent in an authorization header only to this MaseNet site. It is not saved in browser storage and is cleared after the test.</p>
</main>
<script>
const form=document.getElementById('check');
const input=document.getElementById('secret');
const runButton=document.getElementById('run');
const output=document.getElementById('result');
const testButton=document.getElementById('test');
let authenticatedSecret='';
form.addEventListener('submit',async event=>{
 event.preventDefault();
 const secret=input.value.trim();
 if(!secret)return;
 authenticatedSecret=secret;
 testButton.disabled=true;
 runButton.disabled=true;runButton.textContent='Checking…';
 output.style.display='block';output.textContent='Running read-only checks…';
 try{
  const response=await fetch('/api/telegram/promotions/diagnostic',{method:'POST',headers:{'Authorization':'Bearer '+secret,'Content-Type':'application/json'},body:'{}',cache:'no-store'});
  const data=await response.json();
  output.textContent=JSON.stringify({httpStatus:response.status,...data},null,2);
  testButton.disabled=!(response.ok&&data.ok&&data.checks&&data.checks.adminChatConfigured&&data.checks.telegramBotTokenConfigured);
 }catch(error){authenticatedSecret='';output.textContent='Request failed: '+(error&&error.message?error.message:'Network error');}
 finally{input.value='';runButton.disabled=false;runButton.textContent='Run safe diagnostic';}
});
testButton.addEventListener('click',async()=>{
 if(!authenticatedSecret)return;
 testButton.disabled=true;testButton.textContent='Sending admin-only test…';
 output.style.display='block';output.textContent='Sending exactly one message to the configured admin chat…';
 try{
  const response=await fetch('/api/telegram/promotions/test-admin',{method:'POST',headers:{'Authorization':'Bearer '+authenticatedSecret,'Content-Type':'application/json'},body:'{}',cache:'no-store'});
  const data=await response.json();
  output.textContent=JSON.stringify({httpStatus:response.status,...data},null,2);
 }catch(error){output.textContent='Request failed: '+(error&&error.message?error.message:'Network error');}
 finally{authenticatedSecret='';testButton.disabled=true;testButton.textContent='Send one admin-only Telegram test';}
});
</script>
</body>
</html>
