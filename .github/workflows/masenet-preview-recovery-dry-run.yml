name: MaseNet Streamlink Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/masenet-preview-recovery-dry-run.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: masenet-preview-recovery-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RECOVERY_DRY_RUN: "true"
      MASETV_RECOVERY_URL: https://5968ebda.masetv-cloudflare-migration.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Preview-only configuration
        run: |
          node --input-type=module -e '
            const raw = process.env.MASETV_RECOVERY_URL || "";
            const url = new URL(raw);
            if (url.protocol !== "https:" || !/^[a-f0-9]{8}\\.masetv-cloudflare-migration\\.pages\\.dev$/i.test(url.hostname)) {
              throw new Error("Refusing to run: URL must be a hashed Cloudflare Pages Preview hostname, never the production hostname.");
            }
            console.log("Preview hostname validated:", url.hostname);
          '
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=masenet-streamlink-recovery")"
          TOKEN="$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))' <<< "$RESPONSE")"
          if [ -z "$TOKEN" ]; then
            echo "GitHub did not issue an OIDC token."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run read-only recovery scan
        env:
          STREAMLINK_RECOVERY_SCAN_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node scripts/streamlink-recovery.mjs
