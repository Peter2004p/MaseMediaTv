name: MaseNet Preview recovery dry run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masenet-preview-recovery-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.ref == 'refs/heads/feature/streamlink-recovery-unified'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RECOVERY_DRY_RUN: "true"
      MASETV_RECOVERY_URL: ${{ secrets.MASETV_PREVIEW_RECOVERY_URL }}
      STREAMLINK_RECOVERY_SCAN_TOKEN: ${{ secrets.STREAMLINK_RECOVERY_SCAN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Preview-only configuration
        run: |
          node --input-type=module -e '
            const raw = process.env.MASETV_RECOVERY_URL || "";
            if (!raw) throw new Error("Missing GitHub secret MASETV_PREVIEW_RECOVERY_URL.");
            if (!process.env.STREAMLINK_RECOVERY_SCAN_TOKEN) throw new Error("Missing GitHub secret STREAMLINK_RECOVERY_SCAN_TOKEN.");
            const url = new URL(raw);
            if (url.protocol !== "https:" || !/^[a-f0-9]{8}\\.masetv-cloudflare-migration\\.pages\\.dev$/i.test(url.hostname)) {
              throw new Error("Refusing to run: URL must be a hashed Cloudflare Pages Preview hostname, never the production hostname.");
            }
            console.log("Preview hostname validated:", url.hostname);
          '
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run read-only recovery scan
        run: node scripts/streamlink-recovery.mjs
