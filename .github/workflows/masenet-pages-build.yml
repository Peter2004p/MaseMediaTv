name: MaseNet Pages build

on:
  push:
    branches:
      - feature/masenet-telegram-vault-release
  pull_request:
    branches:
      - cloudflare-migration

permissions:
  contents: read

jobs:
  pages-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check Pages Functions and build frontend
        run: npm run build
