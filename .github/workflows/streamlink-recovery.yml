name: MaseNet Streamlink Recovery

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: masenet-streamlink-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out reviewed recovery implementation
        uses: actions/checkout@v4
        with:
          ref: feature/streamlink-recovery-unified

      - name: Check recovery credentials before starting
        id: credentials
        env:
          MASETV_RECOVERY_URL: https://feature-streamlink-recovery.masetv-cloudflare-migration.pages.dev/api/streamlink-recovery
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          KDL_AIR_BOT_USERNAME: ${{ secrets.KDL_AIR_BOT_USERNAME }}
        run: |
          missing=0
          for name in MASETV_RECOVERY_URL TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION KDL_AIR_BOT_USERNAME; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::warning::Recovery is not activated: missing GitHub Actions secret $name"
              missing=1
            fi
          done
          # Never allow this pre-release scheduler to mutate the live catalogue.
          # The recovery API and credentials must target the isolated preview deployment.
          # API authorization uses a short-lived, repository-scoped GitHub OIDC token. The API also restricts the token to this workflow on main. The runner logs non-secret identity claims for diagnostics.
          if [ "$MASETV_RECOVERY_URL" != "https://feature-streamlink-recovery.masetv-cloudflare-migration.pages.dev/api/streamlink-recovery" ]; then
            echo "::error::Recovery endpoint is not the isolated recovery Preview deployment."
            exit 1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Request short-lived GitHub OIDC token
        id: oidc
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("masenet-streamlink-recovery");
            core.setOutput("token", token);

      - name: Set up Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Telegram client
        if: steps.credentials.outputs.ready == 'true'
        run: npm install --no-save telegram

      - name: Recover confirmed expired streamlinks
        if: steps.credentials.outputs.ready == 'true'
        env:
          MASETV_RECOVERY_URL: https://feature-streamlink-recovery.masetv-cloudflare-migration.pages.dev/api/streamlink-recovery
          STREAMLINK_RECOVERY_TOKEN: ${{ steps.oidc.outputs.token }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          KDL_AIR_BOT_USERNAME: ${{ secrets.KDL_AIR_BOT_USERNAME }}
        run: node scripts/streamlink-recovery.mjs
# Preview OIDC validation trigger: isolated recovery deployment is ready.
