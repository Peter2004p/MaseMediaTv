name: MaseNet Streamlink Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: masenet-streamlink-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Telegram client
        run: npm install --no-save telegram

      - name: Recover confirmed expired streamlinks
        env:
          MASETV_RECOVERY_URL: ${{ secrets.MASETV_RECOVERY_URL }}
          STREAMLINK_RECOVERY_SECRET: ${{ secrets.STREAMLINK_RECOVERY_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          KDL_AIR_BOT_USERNAME: ${{ secrets.KDL_AIR_BOT_USERNAME }}
        run: |
          if [ -z "$MASETV_RECOVERY_URL" ] || [ -z "$STREAMLINK_RECOVERY_SECRET" ] || [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ] || [ -z "$TELEGRAM_SESSION" ] || [ -z "$KDL_AIR_BOT_USERNAME" ]; then
            echo "::warning::Recovery is not activated. Add all required repository Actions secrets after reviewing docs/streamlink-auto-recovery.md."
            exit 0
          fi
          node scripts/streamlink-recovery.mjs
