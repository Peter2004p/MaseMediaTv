name: MaseNet Streamlink Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: masenet-streamlink-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out reviewed recovery implementation
        uses: actions/checkout@v4
        with:
          ref: feature/streamlink-auto-recovery

      - name: Check recovery credentials before starting
        id: credentials
        env:
          MASETV_RECOVERY_URL: ${{ secrets.MASETV_RECOVERY_URL }}
          STREAMLINK_RECOVERY_SECRET: ${{ secrets.STREAMLINK_RECOVERY_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          KDL_AIR_BOT_USERNAME: ${{ secrets.KDL_AIR_BOT_USERNAME }}
        run: |
          missing=0
          for name in MASETV_RECOVERY_URL STREAMLINK_RECOVERY_SECRET TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION KDL_AIR_BOT_USERNAME; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::warning::Recovery is not activated: missing GitHub Actions secret $name"
              missing=1
            fi
          done
          # Never allow this pre-release scheduler to mutate the live catalogue.
          # The recovery API and credentials must target the isolated preview deployment.
          if [ "$MASETV_RECOVERY_URL" != "https://02158987.masetv-cloudflare-migration.pages.dev/api/streamlink-recovery" ]; then
            echo "::warning::Recovery is not activated: MASETV_RECOVERY_URL must point to the verified isolated preview deployment."
            missing=1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Telegram client
        if: steps.credentials.outputs.ready == 'true'
        run: npm install --no-save telegram

      - name: Recover confirmed expired streamlinks
        if: steps.credentials.outputs.ready == 'true'
        env:
          MASETV_RECOVERY_URL: ${{ secrets.MASETV_RECOVERY_URL }}
          STREAMLINK_RECOVERY_SECRET: ${{ secrets.STREAMLINK_RECOVERY_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          KDL_AIR_BOT_USERNAME: ${{ secrets.KDL_AIR_BOT_USERNAME }}
        run: node scripts/streamlink-recovery.mjs
