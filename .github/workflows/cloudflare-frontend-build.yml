name: Cloudflare migration frontend build
on:
  push:
    branches: [cloudflare-migration, fix/mase-mkv-browser-playback, masenet-download-centre, masenet-app-promo-correction, masenet-stream-manager-bot, feature/streamlink-auto-recovery]
  pull_request:
    branches: [cloudflare-migration]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
      - run: npm install
      - run: node --check scripts/streamlink-recovery.mjs
      - run: node --check scripts/create-telegram-session.mjs
      - run: npm run build
      - run: npm run typecheck:functions
