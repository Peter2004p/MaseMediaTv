name: Build MaseNet Android APK

on:
  push:
    branches:
      - masenet-android-apk
    paths:
      - package.json
      - capacitor.config.ts
      - src/**
      - functions/api/auth/**
      - public/masenet-app-icon.svg
      - scripts/prepare-android-native.py
      - .github/workflows/build-android-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and publish MaseNet Android installer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out MaseNet
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install project and Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Build the offline-capable web app bundle
        run: npm run build

      - name: Generate the Android wrapper
        run: npx cap add android

      - name: Generate launcher icons from the MaseNet app icon
        run: |
          mkdir -p assets
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp('public/masenet-app-icon.svg')
            .resize(1024, 1024, { fit: 'contain', background: '#05050b' })
            .png()
            .toFile('assets/icon.png');
          NODE
          npx capacitor-assets generate --android

      - name: Configure Android app link and navigation
        run: python3 scripts/prepare-android-native.py

      - name: Prepare Capacitor Android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Synchronize native Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaseNet-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: ncipollo/release-action@v1
        with:
          tag: masenet-android-latest
          name: MaseNet Android Installer
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk
          artifactContentType: application/vnd.android.package-archive
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
