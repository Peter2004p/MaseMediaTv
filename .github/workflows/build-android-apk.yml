name: Build MaseNet Android APK

on:
  push:
    branches:
      - masenet-android-apk
    paths:
      - package.json
      - capacitor.config.ts
      - src/**
      - functions/api/auth/**
      - public/masenet-app-icon.svg
      - public/sw.js
      - scripts/prepare-android-native.py
      - .github/workflows/build-android-apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masenet-android-apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and publish MaseNet Android installer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out MaseNet
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install project and Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Build the MaseNet web app bundle
        run: npm run build

      - name: Generate the Android wrapper
        run: npx cap add android

      - name: Generate and verify MaseNet launcher icons
        run: |
          mkdir -p assets
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { readFile, writeFile } from 'node:fs/promises';
          // Read the original uploaded JPEG bytes directly. Rasterizing the
          // previous SVG wrapper silently dropped its embedded <image>, which
          // is why Android received a plain dark square.
          const svg = await readFile('public/masenet-app-icon.svg', 'utf8');
          const match = svg.match(/data:image\/jpeg;base64,([A-Za-z0-9+/=]+)/);
          if (!match) throw new Error('The supplied MaseNet artwork is missing from the icon source.');
          const original = Buffer.from(match[1], 'base64');
          const source = sharp(original);
          const metadata = await source.metadata();
          if (!metadata.width || !metadata.height || metadata.width < 2 || metadata.height < 2) {
            throw new Error('The supplied MaseNet logo image has invalid dimensions.');
          }
          // The supplied image contains two neon marks across its top edge.
          // Use the complete left-hand MaseNet mark, not a tiny 128x60 corner
          // that made the launcher artwork look like a blank square.
          const cropWidth = Math.floor(metadata.width / 2);
          const cropHeight = Math.floor(metadata.height / 4);
          const mark = await source
            .extract({ left: 0, top: 0, width: cropWidth, height: cropHeight })
            .resize(820, 410, { fit: 'fill' })
            .png()
            .toBuffer();
          const png = await sharp({
            create: { width: 1024, height: 1024, channels: 4, background: '#090b18' }
          }).composite([{ input: mark, left: 102, top: 307 }]).png().toBuffer();
          const stats = await sharp(png).stats();
          if (stats.channels.every(channel => channel.stdev < 2)) {
            throw new Error('The generated MaseNet icon is blank; refusing to build a blank launcher icon.');
          }
          await writeFile('assets/icon.png', png);
          console.log('Generated launcher icon from supplied artwork; pixel variation:', stats.channels.map(channel => channel.stdev.toFixed(1)).join(', '));
          NODE
          npx capacitor-assets generate --android
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { readdir } from 'node:fs/promises';
          import { join } from 'node:path';
          async function walk(dir) {
            const out = [];
            for (const item of await readdir(dir, { withFileTypes: true })) {
              const path = join(dir, item.name);
              if (item.isDirectory()) out.push(...await walk(path));
              else if (/ic_launcher.*\.png$/i.test(item.name)) out.push(path);
            }
            return out;
          }
          const files = await walk('android/app/src/main/res');
          if (!files.length) throw new Error('Android launcher PNG resources were not generated.');
          const visible = [];
          for (const path of files) {
            const info = await sharp(path).metadata();
            const stats = await sharp(path).stats();
            if (info.width && info.height && stats.channels.some(channel => channel.stdev >= 2)) visible.push(path);
          }
          if (!visible.length) throw new Error('All generated Android launcher PNG resources appear blank.');
          console.log('Verified nonblank Android launcher icon resources:', visible.join(', '));
          NODE

      - name: Configure Android app link and navigation
        run: python3 scripts/prepare-android-native.py

      - name: Prepare Capacitor Android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Synchronize native Android project
        run: npx cap sync android

      # Keep the debug signing key stable between GitHub-hosted builds so
      # users can install future APKs over the existing app without losing data.
      - name: Restore persistent Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: masenet-android-debug-keystore-v1

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaseNet-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: ncipollo/release-action@v1
        with:
          tag: masenet-android-latest
          name: MaseNet Android Installer
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk
          artifactContentType: application/vnd.android.package-archive
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
