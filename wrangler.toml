# MaseTv Cloudflare Pages configuration (migration workspace)
name = "masetv-cloudflare-migration"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-18"

[[d1_databases]]
binding = "DB"
database_name = "masetv-cloudflare-migration"
database_id = "2ac7a9cc-868f-4346-9f6d-bafcd44a4ad4"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "masenet-posters"

[ai]
binding = "AI"

# Isolate Pages preview deployments from production data.
[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "masenet-asian-discovery-preview"
database_id = "783e9c3d-b758-4273-9999-b6fffc6b560c"
migrations_dir = "migrations"

# Worker preview bindings must use isolated preview resources, never production.
[[previews.d1_databases]]
binding = "DB"
database_name = "masenet-asian-discovery-preview"
database_id = "783e9c3d-b758-4273-9999-b6fffc6b560c"
migrations_dir = "migrations"

[[previews.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "masetv-mkv-preview-media"

[previews.ai]
binding = "AI"
