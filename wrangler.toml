# MaseTv Cloudflare Pages configuration (migration workspace)
name = "masetv-cloudflare-migration"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-18"

[[d1_databases]]
binding = "DB"
database_name = "masetv-cloudflare-migration"
database_id = "2ac7a9cc-868f-4346-9f6d-bafcd44a4ad4"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "masenet-posters"

[ai]
binding = "AI"

# Preview-only bindings required by `wrangler pages deploy --preview`.
# Keep preview resources separate from production resources.
[[previews.d1_databases]]
binding = "DB"
database_id = "00000000-0000-0000-0000-000000000000"

[[previews.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "masenet-preview-media"

[previews.ai]
binding = "AI"
