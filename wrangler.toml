# MaseTv Cloudflare Pages configuration (migration workspace)

# Wrangler's Worker preview command uses the top-level previews block.
# Keep all preview bindings pointed at the isolated Preview resources.
[[previews.d1_databases]]
binding = "DB"
database_id = "783e9c3d-b758-4273-9999-b6fffc6b560c"

[[previews.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "masenet-posters"

[previews.ai]
binding = "AI"

name = "masetv-cloudflare-migration"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-18"

[[d1_databases]]
binding = "DB"
database_name = "masetv-cloudflare-migration"
database_id = "2ac7a9cc-868f-4346-9f6d-bafcd44a4ad4"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "masenet-posters"

[ai]
binding = "AI"


[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "masetv-cloudflare-migration-preview"
database_id = "783e9c3d-b758-4273-9999-b6fffc6b560c"

[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "masenet-posters"

[env.preview.ai]
binding = "AI"
